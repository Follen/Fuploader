      truncated: false
  - id: A5
    source: brief.md
    text: 生产测试、npm 打包、tag 和 npm 发布均有可复核命令及结果记录。
    result: passed
    reason:
      text: Merged main d4ae0fe, tag v0.0.6 pushed, GitHub workflow 31897526885 passed
        on Ubuntu/Windows and OIDC npm publish; registry latest is 0.0.6.
      truncated: false
  - id: A6
    source: specs/blackbox-client-session/spec.md
    text: The provider MUST prefer the official desktop profile at
      `%APPDATA%/heybox-pc-launcher/config.json`. It MUST locate the account id,
      encrypted `user_pkey`, and `x_xhh_tokenid` without logging their values.
      The encrypted pkey MUST be decrypted with the client-compatible
      AES-256-CBC format and the configured key. If the official config is
      absent or incomplete, the provider MAY fall back to the Chromium
      `Network/Cookies` database.
    result: passed
    reason:
      text: config.json priority, AES-256-CBC pkey decryption and Chromium fallback
        are implemented and covered by fixture test.
      truncated: false
  - id: A7
    source: specs/blackbox-client-session/spec.md
    text: Requests MUST include the current desktop identity fields
      (`x_client_type=pc`, `x_os_type`, `x_app=heybox_pc`, `version`,
      `exe_version`, `os_version`, `device_id`, and `heybox_id`) when available,
      plus `_time`, `_chat_time`, `nonce`, and `hkey`. The hkey input timestamp
      MUST match the 1.14.1 client implementation. Authentication MUST send the
      current token header and Cookie values without exposing them in errors or
      artifacts.
    result: passed
    reason:
      text: Client 1.14.1 identity fields, Cookie header, token header and hkey time+1
        are implemented and wire-tested.
      truncated: false
  - id: A8
    source: specs/blackbox-client-session/spec.md
    text: The provider MUST continue to support plugin list, detail, version list,
      module metadata update, version create/update, and version delete. Omitted
      metadata fields MUST be preserved from a detail read. Whole-module
      deletion is out of scope.
    result: passed
    reason:
      text: List/detail/versions, module edit, version create/update/delete and
        omitted-field preservation remain supported.
      truncated: false
  - id: A9
    source: specs/blackbox-client-session/spec.md
    text: For the current client protocol, archive upload MUST support the sequence
      `info/v2 -> token/v2 -> COS object upload -> callback/v2`; multipart
      uploads MAY use heartbeat. The implementation MUST retain the old
      `/wow/cos/upload/token/` fallback only when the current protocol is
      unavailable and MUST return a verified URL and checksum.
    result: passed
    reason:
      text: V2 JSON info/token/callback mapping is implemented and tested; live
        creator upload used the retained official Workshop COS fallback when V2
        was unavailable.
      truncated: false
  - id: A10
    source: specs/blackbox-client-session/spec.md
    text: Every real version mutation MUST use a unique marker, poll the version
      list for readback, retry deletion when the audit state remains active, and
      restore the baseline module fields and active version set. Verification
      output MUST include exact commands, redacted inputs, literal statuses,
      exit codes, and runnable rollback.
    result: passed
    reason:
      text: Unique marker, polling, delete retry unit coverage, exact live
        verification, and rollback evidence are present.
      truncated: false
  - id: A11
    source: specs/blackbox-client-session/spec.md
    text: The change MUST add or update redacted artifacts under `analyze/` covering
      client version/session storage, request signing, web capture routes, COS
      field shapes, verification results, source hashes, and known evidence
      gaps. Raw credentials and raw request bodies MUST NOT be added.
    result: passed
    reason:
      text: Redacted web/client/COS artifacts, source hashes and evidence gaps are
        stored under analyze without raw credentials.
      truncated: false
