    text: 状态不适用时不得静默跳过；矩阵报告必须明确标记为“不适用”并给出合同原因。omitted 必须明确落入以下且仅以下一种结果：create
      默认、update/edit 保留当前值、官方条件清空、wire 省略、schema 拒绝。`false`、`0`、空字符串、空数组、omitted
