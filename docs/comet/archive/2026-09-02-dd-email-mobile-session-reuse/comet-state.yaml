    source: specs/dd-publishing/spec.md
    text: 回归基本单元为 `resource × action × field × state`。每个 case 使用稳定 ID，并至少记录输入、当前远端
      projection、动态依赖 fixture、预期 schema 结果、预期 GET/native-parser/upload 调用、预期
      endpoint、预期最终 JSON body、预期 mutation 次数、预期 readback 字段和不确定性分类。测试失败信息必须包含
