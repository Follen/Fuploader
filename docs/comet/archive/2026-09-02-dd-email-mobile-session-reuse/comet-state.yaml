    source: specs/dd-publishing/spec.md
    text: 每个字段必须覆盖其适用状态：omitted、正常有效值、替代有效值；布尔字段覆盖 true/false；数值字段覆盖 0、合法上下边界、越界和
      bool
      伪装；字符串覆盖空字符串、最大长度、超长和非法枚举；数组覆盖空数组、正常数组、最大项数、超项、非法元素及必要的顺序/去重语义；对象覆盖完整值、缺少子字段、未知子字段、非法
      selector 和仅在官方支持时的 null。条件字段还必须覆盖父条件启用、父条件关闭但旧子字段存在、父项切换后旧
