acceptance:
  - id: A1
    source: brief.md
    text: 网页 profile 不存在或已过期时，`python fupload/scripts/fupload.py blackbox plugin
      list` 启动有头 Chromium Workshop 登录窗口；用户完成登录后，网页协议请求返回 `status=ok`，并能读取
      TapTool 的详情和版本列表。
    result: passed
    reason:
      text: Live headed login and web reads succeeded.
      truncated: false
  - id: A2
    source: brief.md
    text: 网页 Cookie 失效时，无头探活转为有头登录；登录完成前不会执行任何写操作，登录完成后继续原始读写操作。
    result: passed
    reason:
      text: Expiry login gate and no pre-ready write are covered.
      truncated: false
  - id: A3
    source: brief.md
    text: 桌面客户端未安装、未启动或未登录时不影响 Blackbox；命令不会读取其配置或 Cookie 数据库。
    result: passed
    reason:
      text: Desktop auth module is absent from source and package.
      truncated: false
  - id: A4
    source: brief.md
    text: 对固定 `path/_time/nonce` 回归向量，Python Web signer 与网页前端 signer 输出逐字一致；实际
      Workshop 请求不再返回 `relogin`。
    result: passed
    reason:
      text: Signer vectors and live requests pass.
      truncated: false
  - id: A5
    source: brief.md
    text: TapTool 的每个允许模块字段在真实 edit 后可读回，并在测试结束前恢复到基线；服务端未立即投影的字段必须记录为已知限制而不是误报成功。
    result: passed
    reason:
      text: All module fields were verified and restored.
      truncated: false
  - id: A6
    source: brief.md
    text: 测试版本可携带 ZIP 创建；名称、类型、游戏版本和压缩包可替换并读回；删除在必要时只重试一次，最终测试版本不存在或 `auditState=4`。
    result: passed
    reason:
      text: Live ZIP version lifecycle and deletion pass.
      truncated: false
  - id: A7
    source: brief.md
    text: 真实测试结束后 TapTool 的模块字段与活动版本集合等于测试前基线，仓库中只保留脱敏证据。
    result: passed
    reason:
      text: Final module and active versions equal baseline.
      truncated: false
  - id: A8
    source: brief.md
    text: 归档前所有版本载体已统一到下一 SemVer，manifest、pack、install 与 release 前置检查通过，目标 tag 尚未占用且
      tag 发布 workflow 可用；归档后再按固定顺序完成合并、tag CI 与 npm `latest` 核对。
    result: passed
    reason:
      text: 0.0.7 carriers, manifest, pack, install, tag availability, and workflow
        are verified.
      truncated: false
  - id: A9
    source: specs/blackbox-client-session/spec.md
    text: The Blackbox provider MUST use a Fuploader-managed Chromium persistent
      profile created inside the product state directory as its only
      authentication source. It MUST NOT load, require, or inspect the Heybox
      desktop client's `config.json`, account state, Cookie storage,
      installation, or running process. The desktop client being absent,
      stopped, or signed out MUST NOT prevent Blackbox from opening or reusing
      its managed web session.
    result: passed
    reason:
      text: Only managed web profile auth remains.
      truncated: false
  - id: A10
    source: specs/blackbox-client-session/spec.md
    text: The provider MUST never open or import Chrome, Edge, Electron, another
      Playwright profile, or system browser Cookie databases. The profile
      directory MUST be selected internally and MUST NOT be supplied through a
      command document or ordinary configuration. Cookie values and storage
      state MUST remain inside the persistent BrowserContext and MUST NOT be
      exported into an independent request context, state file, or command
      output.
    result: passed
    reason:
      text: Internal profile and BrowserContext Cookie boundary pass.
      truncated: false
  - id: A11
    source: specs/blackbox-client-session/spec.md
    text: The web-session state machine MUST have explicit `headless_probe`,
      `headed_login`, `ready`, `expired`, and `failed` states. It MUST begin
      with a headless probe of the fixed Workshop entry URL and a read-only
      module-list protocol request. On `login`, `relogin`, expired storage, or
      an unusable profile, it MUST transition to `headed_login`, open the same
      persistent profile in a visible Chromium window, and wait for the Workshop
      route plus a successful read-only module-list response. It MUST persist
      only non-sensitive state metadata; cookies, storage values, web tokens,
      and signed URLs remain inside the browser profile and process memory.
    result: passed
    reason:
      text: Five-state live transition is evidenced.
      truncated: false
  - id: A12
    source: specs/blackbox-client-session/spec.md
    text: After headed login succeeds, subsequent calls MUST return to headless mode
      and reuse the same profile. A web session expiry during a read or before a
      mutation MUST trigger one headed re-login and then retry the read-only
      operation; an uncertain mutation MUST return `verification_required` and
      MUST NOT be replayed automatically.
    result: passed
    reason:
      text: Read re-login and POST no-replay pass.
      truncated: false
  - id: A13
    source: specs/blackbox-client-session/spec.md
    text: Workshop requests MUST use a fixed allowlisted protocol route through the
      managed Playwright BrowserContext request object so HttpOnly browser
      cookies remain attached without being exported. The route MUST generate
      the web signer and identity fields observed from the Workshop page, MUST
      reject arbitrary absolute URLs and caller-supplied headers or credentials,
      and MUST return redacted status/error data to the CLI. The protocol
      implementation MUST support GET reads and URL-encoded POST mutation forms
      without exposing the browser page or request body as command output.
    result: passed
    reason:
      text: Allowlist, protocol fields, and form encoding pass.
      truncated: false
  - id: A14
    source: specs/blackbox-client-session/spec.md
    text: The signer MUST match fixed regression vectors captured from successful
      web requests and MUST vary correctly across different paths, timestamps,
      and nonces. Authentication cookies MUST remain in the BrowserContext
      Cookie jar; only the query fields and request headers demonstrated by the
      current web client MAY be sent.
    result: passed
    reason:
      text: Signer variation and live success pass.
      truncated: false
  - id: A15
    source: specs/blackbox-client-session/spec.md
    text: Callers MUST NOT be able to supply a profile path, cookie, token, pkey,
      signature, API origin, or temporary upload credential through a Blackbox
      command document or ordinary configuration. Errors and output MUST
      recursively redact credentials, signatures, nonce values, device
      identifiers, and signed upload parameters.
    result: passed
    reason:
      text: Credential input rejection and redaction pass.
      truncated: false
  - id: A16
    source: specs/blackbox-client-session/spec.md
    text: The provider MUST continue to support plugin list, plugin detail, version
      list, complete module metadata update with omitted-field preservation,
      version creation, version edit, archive replacement, and individual
      version deletion. It MUST NOT expose or invoke whole-module deletion.
    result: passed
    reason:
      text: Required operations remain without module deletion.
      truncated: false
  - id: A17
    source: specs/blackbox-client-session/spec.md
    text: Module edits MUST read the current module, overlay only caller-specified
      allowed fields, submit the complete current-client form, and compare each
      requested field with a fresh detail read. Version creation and edit MUST
      submit the current-client field set, poll GET-only readback, verify name,
      type, game-version bindings, and an authoritative non-empty archive URL,
      and MUST NOT blindly replay an ambiguous mutation.
    result: passed
    reason:
      text: Complete forms and GET readback pass.
      truncated: false
  - id: A18
    source: specs/blackbox-client-session/spec.md
    text: Version deletion MUST poll until the row is absent or has the deleted
      audit state. After the first delete settles, it MAY retry the same delete
      exactly once only if the same version becomes active again, then MUST
      perform final GET-only verification.
    result: passed
    reason:
      text: Bounded delete retry and final GET pass.
      truncated: false
  - id: A19
    source: specs/blackbox-client-session/spec.md
    text: ZIP upload MUST use the verified web creator flow, including the
      allowlisted Workshop upload-token route and constrained COS object upload.
      It MUST NOT depend on desktop-account API endpoints. Temporary COS
      credentials and signed URLs MUST remain in memory and MUST NOT be written
      to plans, logs, analysis, or command output. The existing archive is
      read-only input; the provider MUST calculate byte count and SHA-256 and
      return only non-sensitive verification metadata.
    result: passed
    reason:
      text: Web token and constrained COS upload pass.
      truncated: false
  - id: A20
    source: specs/blackbox-client-session/spec.md
    text: If more than one verified upload flow remains supported, fallback is
      allowed only after a definite pre-mutation unavailability response. A
      timeout or uncertain object upload/callback MUST be reported as
      verification-required and MUST NOT cause an automatic second upload.
    result: passed
    reason:
      text: Uncertain upload is not replayed.
      truncated: false
  - id: A21
    source: specs/blackbox-client-session/spec.md
    text: Real verification MUST use the Fuploader-managed web creator session to
      select the TapTool plugin from the current account. It MUST record a
      redacted baseline for module fields and active versions, then exercise
      read list/detail/versions, allowed module-field edits, test-version
      creation with a ZIP from `D:/Code/TAP Tool`, version-field edits, archive
      replacement, and individual version deletion. Whole-module deletion MUST
      NOT run.
    result: passed
    reason:
      text: Live TapTool workflow is complete.
      truncated: false
  - id: A22
    source: specs/blackbox-client-session/spec.md
    text: Every test mutation MUST use a unique marker and immediate GET-only
      readback. The final rollback MUST restore all changed module fields and
      remove or mark deleted every test version so the active module fields and
      version set match the baseline. Verification evidence MUST include exact
      commands, redacted inputs, literal statuses, exit codes, baseline/modified
      comparisons, and a runnable rollback procedure.
    result: passed
    reason:
      text: Exact command, result, comparison, and rollback ledger exists.
      truncated: false
  - id: A23
    source: specs/blackbox-client-session/spec.md
    text: The change MUST update artifacts under
      `analyze/blackbox/client-session-20260816/` with installed client version
      and hashes, session-field provenance, bytecode/decompilation findings,
      signer vectors, endpoint and field matrices, upload-flow evidence, real
      verification results, and unresolved evidence gaps. Raw cookies, pkeys,
      tokens, device ids, signatures, nonces, signed URLs, request bodies
      containing private content, and temporary credentials MUST NOT be
      committed.
    result: passed
    reason:
      text: Required redacted analysis exists.
      truncated: false
  - id: A24
    source: specs/blackbox-client-session/spec.md
    text: Analysis MUST also record the managed-profile state-machine transitions,
      Playwright/Chromium versions, venv dependency hashes, protocol allowlist,
      login/readiness probes, and redacted expiry/re-login results. It MUST NOT
      record the persistent profile contents or storage state.
    result: passed
    reason:
      text: Runtime versions, hashes, states, and re-login are recorded.
      truncated: false
  - id: A25
    source: specs/blackbox-client-session/spec.md
    text: Automated verification MUST cover the absence of desktop/browser database
      access, managed-profile selection, headed/headless transitions, web
      request identity and signer vectors, recursive redaction, Workshop read
      requests, module edits, version create/edit/delete, and ZIP upload
      behavior. Existing non-Blackbox provider behavior MUST remain unchanged.
    result: passed
    reason:
      text: Runtime executed Python 254, npm 24, pack, install, compile, and diff
        checks successfully.
      truncated: false
  - id: A26
    source: specs/blackbox-client-session/spec.md
    text: "Before Native archive, release preparation MUST advance all package
      version carriers to the same next SemVer, rebuild the distribution
      manifest, pass package and installation checks, verify the target tag is
      unoccupied, and confirm the tag publication workflow is available. The
      operational release then occurs after Native archive: merge into `main`,
      create the tag from merged `main`, wait for tag CI, and confirm npm
      `latest` equals the released version."
    result: passed
    reason:
      text: 0.0.7 release preparation and tag workflow are verified.
      truncated: false
